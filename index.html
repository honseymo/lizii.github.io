<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <link rel="icon" href="cat.ico" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#7ae1ca">
    <title>Лизи любимка</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --mint: rgb(122, 225, 202);
            --peach: rgb(249, 224, 220);
            --cream: rgb(237, 242, 208);
            --rose: #ff5c8a;
            --orange: #ff9a3c;
            --ink: #4a3b47;
        }

        * { box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 24px;
            font-family: 'Nunito', 'Segoe UI', Arial, sans-serif;
            color: var(--ink);
            overflow: hidden;
            background: linear-gradient(180deg, var(--mint) 26%, var(--peach) 55%, var(--cream));
            transition: background 1.2s ease;
        }

        /* ночное небо, когда запускаются салюты */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at 50% 120%, #4b2a5e 0%, #1c1830 55%, #0f0d1c 100%);
            opacity: 0;
            transition: opacity 1.4s ease;
            z-index: 0;
        }
        body.night::before { opacity: 1; }

        /* мягкие размытые пятна на фоне */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            opacity: .55;
            z-index: 0;
            animation: drift 14s ease-in-out infinite alternate;
        }
        .blob.b1 { width: 340px; height: 340px; background: #fff3a8; top: -90px; left: -80px; }
        .blob.b2 { width: 380px; height: 380px; background: #ffb3c7; bottom: -120px; right: -100px; animation-delay: -5s; }
        .blob.b3 { width: 260px; height: 260px; background: #b9f3e4; top: 45%; left: 62%; animation-delay: -9s; }
        @keyframes drift {
            from { transform: translate(0, 0) scale(1); }
            to   { transform: translate(40px, -30px) scale(1.15); }
        }

        /* плавающие сердечки */
        .hearts {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }
        .heart {
            position: absolute;
            bottom: -40px;
            opacity: 0;
            animation: floatUp linear infinite;
            filter: drop-shadow(0 2px 4px rgba(255, 92, 138, .25));
        }
        @keyframes floatUp {
            0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
            10%  { opacity: .85; }
            90%  { opacity: .85; }
            100% { transform: translateY(-110vh) rotate(25deg); opacity: 0; }
        }

        .canva {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* карточка */
        .flexboxr {
            position: relative;
            z-index: 10;
            width: min(100%, 440px);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 28px 24px 26px;
            border-radius: 32px;
            background: rgba(255, 255, 255, .38);
            border: 1px solid rgba(255, 255, 255, .7);
            backdrop-filter: blur(18px) saturate(140%);
            -webkit-backdrop-filter: blur(18px) saturate(140%);
            box-shadow:
                0 20px 60px rgba(120, 80, 110, .18),
                inset 0 1px 0 rgba(255, 255, 255, .8);
            animation: cardIn .9s cubic-bezier(.2, .9, .3, 1) both;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(24px) scale(.96); }
            to   { opacity: 1; transform: none; }
        }

        .title {
            margin: 0 0 4px;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: rgba(74, 59, 71, .55);
        }

        /* котик — как фото-открытка */
        .kotik-wrap {
            display: none;
            width: 100%;
            margin: 14px 0 22px;
            padding: 10px 10px 14px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 14px 34px rgba(90, 50, 80, .22);
            transform: rotate(-2deg);
        }
        .kotik-wrap.show {
            display: block;
            animation: pop .8s cubic-bezier(.2, 1.3, .4, 1) both;
        }
        @keyframes pop {
            0%   { opacity: 0; transform: translateY(20px) scale(.6) rotate(-10deg); }
            100% { opacity: 1; transform: translateY(0) scale(1) rotate(-2deg); }
        }
        .kotik1 {
            display: block;
            width: 100%;
            max-width: 100%;
            height: auto;
            border-radius: 12px;
        }

        /* кнопка */
        .progress-button {
            appearance: none;
            -webkit-appearance: none;
            position: relative;
            overflow: hidden;
            width: 100%;
            padding: 22px 30px;
            font-family: inherit;
            font-size: 18px;
            font-weight: 900;
            color: #fff;
            background: linear-gradient(135deg, #a08aa0, #7d6a80);
            border: none;
            border-radius: 999px;
            cursor: pointer;
            box-shadow: 0 10px 26px rgba(90, 60, 90, .3), inset 0 1px 0 rgba(255, 255, 255, .35);
            transition: transform .25s ease, box-shadow .25s ease, background .4s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .progress-button:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 16px 34px rgba(90, 60, 90, .36), inset 0 1px 0 rgba(255, 255, 255, .35);
        }
        .progress-button:active:not(:disabled) { transform: translateY(0) scale(.98); }
        .progress-button:disabled { cursor: progress; }

        /* блик на кнопке */
        .progress-button::after {
            content: "";
            position: absolute;
            top: 0; left: -60%;
            width: 40%; height: 100%;
            background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .45), transparent);
            transform: skewX(-20deg);
            animation: shine 3.6s ease-in-out infinite;
            z-index: 1;
            pointer-events: none;
        }
        .progress-button:disabled::after { animation: none; opacity: 0; }
        @keyframes shine {
            0%, 55% { left: -60%; }
            100%    { left: 130%; }
        }

        .progress-text {
            position: relative;
            z-index: 3;
            display: flex;
            justify-content: center;
            align-items: center;
            text-shadow: 0 1px 6px rgba(60, 20, 50, .35);
        }

        .progress-bar {
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, .12);
            z-index: 1;
        }

        .progress-fill {
            position: absolute;
            top: 0; bottom: 0; left: 0;
            width: 0%;
            background: linear-gradient(90deg, var(--orange), var(--rose));
            transition: width .1s linear;
            z-index: 2;
        }

        .progress-button.done {
            background: linear-gradient(135deg, var(--orange), var(--rose));
            animation: beat 1.4s ease-in-out infinite;
        }
        .progress-button.done .progress-fill { opacity: 0; }
        @keyframes beat {
            0%, 100% { transform: scale(1); }
            50%      { transform: scale(1.03); }
        }

        @media (max-width: 480px) {
            .flexboxr { padding: 22px 18px 20px; border-radius: 26px; }
            .progress-button { font-size: 17px; padding: 20px 22px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .blob, .heart, .progress-button::after, .progress-button.done { animation: none; }
        }
    </style>
</head>

<body>
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="hearts" id="hearts"></div>

    <canvas class="canva"></canvas>

    <div class="flexboxr">
        <div class="kotik-wrap" id="kotikWrap">
            <img src="kotik.jpg" class="kotik1" alt="Милый котик">
        </div>
        <button class="progress-button" id="progressBtn">
            <span class="progress-text">Кнопочка для лизы!</span>
            <div class="progress-bar"></div>
            <div class="progress-fill" id="progressFill"></div>
        </button>
    </div>

    <script>
        /* ---------- Плавающие сердечки на фоне ---------- */
        (function () {
            const box = document.getElementById('hearts');
            const glyphs = ['♥', '♡', '❤'];
            const colors = ['#ff5c8a', '#ff8fb1', '#ffb3c7', '#ffffff'];
            const count = window.innerWidth < 600 ? 12 : 20;
            for (let i = 0; i < count; i++) {
                const h = document.createElement('span');
                h.className = 'heart';
                h.textContent = glyphs[i % glyphs.length];
                h.style.left = Math.random() * 100 + '%';
                h.style.fontSize = (14 + Math.random() * 26) + 'px';
                h.style.color = colors[i % colors.length];
                h.style.animationDuration = (9 + Math.random() * 10) + 's';
                h.style.animationDelay = (-Math.random() * 18) + 's';
                box.appendChild(h);
            }
        })();

        /* ---------- Салют ---------- */
        let fireworksStarted = false;

        function startFireworks() {
            if (fireworksStarted) return; // запускаем только один цикл анимации
            fireworksStarted = true;
            document.body.classList.add('night');

            const rndColor = () => {
                const base = Math.random() * 360 | 0;
                const color = (275 * (base / 200 | 0)) + base % 200;
                return fac => `hsl(${color}, ${(fac || 1) * 100}%, ${(fac || 1) * 60}%)`;
            };

            class Battery {
                constructor(fireworks) {
                    this.fireworks = fireworks;
                    this.salve = [];
                    this.x = Math.random();
                    this.t = 0;
                    this.tmod = 20 + Math.random() * 20 | 0;
                    this.tmax = 500 + Math.random() * 1000;

                    this._shot = salve => {
                        if (salve.y < salve.ym) {
                            salve.cb = this._prepareExplosion;
                        }

                        salve.x += salve.mx;
                        salve.y -= 0.01;

                        const r = Math.atan2(-0.01, salve.mx);
                        const ctx = this.fireworks.engine;

                        ctx.strokeStyle = salve.c(.7);
                        ctx.beginPath();
                        ctx.moveTo(
                            (this.x + salve.x) * this.fireworks.width + Math.cos(r) * 4,
                            salve.y * this.fireworks.height + Math.sin(r) * 4
                        );
                        ctx.lineTo(
                            (this.x + salve.x) * this.fireworks.width + Math.cos(r + Math.PI) * 4,
                            salve.y * this.fireworks.height + Math.sin(r + Math.PI) * 4
                        );
                        ctx.lineWidth = 3;
                        ctx.lineCap = 'round';
                        ctx.stroke();
                    };

                    this._prepareExplosion = salve => {
                        salve.explosion = [];
                        for (let i = 0, max = 32; i < max; i++) {
                            salve.explosion.push({
                                r: 2 * i / Math.PI,
                                s: 0.5 + Math.random() * 0.5,
                                d: 0,
                                y: 0
                            });
                        }
                        salve.cb = this._explode;
                    };

                    this._explode = salve => {
                        const ctx = this.fireworks.engine;
                        ctx.fillStyle = salve.c();

                        salve.explosion.forEach(explo => {
                            explo.d += explo.s;
                            explo.s *= 0.99;
                            explo.y += 0.5;

                            const alpha = explo.s * 2.5;
                            ctx.globalAlpha = Math.min(alpha, 1);

                            if (alpha < 0.05) {
                                salve.cb = null;
                            }

                            ctx.fillRect(
                                Math.cos(explo.r) * explo.d + (this.x + salve.x) * this.fireworks.width,
                                Math.sin(explo.r) * explo.d + explo.y + salve.y * this.fireworks.height,
                                3,
                                3
                            );
                        });

                        ctx.globalAlpha = 1;
                    };
                }

                pushSalve() {
                    this.salve.push({
                        x: 0,
                        mx: -0.02 * Math.random() * 0.04,
                        y: 1,
                        ym: 0.05 + Math.random() * 0.5,
                        c: rndColor(),
                        cb: this._shot
                    });
                }

                render() {
                    this.t++;

                    if (this.t < this.tmax && (this.t % this.tmod) === 0) {
                        this.pushSalve();
                    }

                    let rendered = false;
                    this.salve.forEach(salve => {
                        if (salve.cb) {
                            rendered = true;
                            salve.cb(salve);
                        }
                    });

                    if (this.t > this.tmax) {
                        return rendered;
                    }
                    return true;
                }
            }

            class Fireworks {
                constructor() {
                    this.canvas = document.querySelector('canvas');
                    this.engine = this.canvas.getContext('2d');
                    this.stacks = new Map();
                    this.counter = 0;
                    this.resize();
                }

                resize() {
                    const dpr = Math.min(window.devicePixelRatio || 1, 2);
                    this.width = window.innerWidth;
                    this.height = window.innerHeight;
                    this.canvas.width = this.width * dpr;
                    this.canvas.height = this.height * dpr;
                    this.engine.setTransform(dpr, 0, 0, dpr, 0, 0);
                }

                clear() {
                    // полупрозрачная заливка оставляет красивые следы от искр
                    this.engine.fillStyle = 'rgba(15, 13, 28, 0.28)';
                    this.engine.fillRect(0, 0, this.width, this.height);
                }

                addBattery() {
                    this.stacks.set(this.counter++, new Battery(this));
                }

                render() {
                    if (Math.random() < 0.05) {
                        this.addBattery();
                    }

                    this.clear();

                    this.stacks.forEach((scene, key) => {
                        if (!scene.render()) {
                            this.stacks.delete(key);
                        }
                    });

                    requestAnimationFrame(this.render.bind(this));
                }

                run() {
                    for (let i = 0; i < 5; i++) {
                        this.addBattery();
                    }
                    window.addEventListener('resize', this.resize.bind(this));
                    this.render();
                }
            }

            new Fireworks().run();
        }

        /* ---------- Кнопка с прогрессом ---------- */
        const button = document.getElementById('progressBtn');
        const progressFill = document.getElementById('progressFill');
        const progressText = button.querySelector('.progress-text');
        let progress = 0;
        let interval = null;

        function startProgressAnimation() {
            // Очистка предыдущего интервала, если он был
            if (interval) {
                clearInterval(interval);
            }

            // Сброс прогресса
            progress = 0;
            progressFill.style.width = '0%';
            button.disabled = true;
            button.classList.remove('done');
            progressText.textContent = '0%';

            interval = setInterval(function () {
                progress += 1;
                progressFill.style.width = progress + '%';
                progressText.textContent = progress + '%';

                if (progress >= 100) {
                    clearInterval(interval);
                    interval = null;
                    button.disabled = false;
                    button.classList.add('done');
                    // Финальная надпись остаётся до следующего нажатия
                    progressText.textContent = 'Я тебя очень люблю!';
                    startFireworks();
                    // Показываем картинку котика
                    const wrap = document.getElementById('kotikWrap');
                    if (wrap) {
                        wrap.classList.add('show');
                    } else {
                        console.error('Элемент с картинкой котика не найден!');
                    }
                }
            }, 50);
        }

        button.addEventListener('click', function () {
            // Если кнопка уже активна (не заблокирована), начинаем новую анимацию
            if (!button.disabled) {
                startProgressAnimation();
            }
        });
    </script>
</body>

</html>
